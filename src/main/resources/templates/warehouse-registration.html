<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Registration — Stock Management System</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 2rem; }
        .card { max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; }
        h1 { margin-top: 0; font-size: 1.5rem; color: #1e3a8a; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; }
        input[type="text"], input[type="number"], input[type="email"] { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
        .btn { background: #1e3a8a; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
        .btn:hover { background: #1d4ed8; }
        .btn-link { display: inline-block; margin-left: 1rem; color: #64748b; text-decoration: none; font-size: 0.9rem; }
        .error-msg { background: #fee2e2; color: #991b1b; padding: 0.75rem; border-radius: 6px; margin-bottom: 1.25rem; }
    </style>
</head>
<body>
<div class="card">
    <h1 th:text="${warehouse.id != null ? 'Update Warehouse' : 'Register New Warehouse'}">Warehouse Registration</h1>
    
    <div th:if="${error}" class="error-msg" th:text="${error}"></div>

    <form th:action="@{/warehouse/create}" th:object="${warehouse}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label for="warehouseCode">Warehouse Code *</label>
            <input type="text" id="warehouseCode" th:field="*{warehouseCode}" placeholder="e.g. WH-KGL-001" required/>
        </div>

        <div class="form-group">
            <label for="warehouseName">Warehouse Name *</label>
            <input type="text" id="warehouseName" th:field="*{warehouseName}" placeholder="e.g. Kigali Central Hub" required/>
        </div>

        <div class="form-group">
            <label for="location">Location *</label>
            <input type="text" id="location" th:field="*{location}" placeholder="e.g. Masaka, Kigali" required/>
        </div>

        <div class="form-group">
            <label for="capacity">Storage Capacity (Units) *</label>
            <input type="number" id="capacity" th:field="*{capacity}" placeholder="e.g. 5000" min="1" required/>
        </div>

        <div class="form-group">
            <label for="contactEmail">Contact Email</label>
            <input type="email" id="contactEmail" th:field="*{contactEmail}" placeholder="manager@warehouse.rw"/>
        </div>

        <button type="submit" class="btn">Save Warehouse</button>
        <a th:href="@{/warehouse/list}" class="btn-link">View All Warehouses</a>
        <a th:href="@{/}" class="btn-link">Home Dashboard</a>
    </form>
</div>
</body>
</html>
