<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — Stock Management System</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .card { max-width: 500px; width: 100%; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; text-align: center; }
        h1 { color: #dc2626; margin-top: 0; }
        p { color: #64748b; margin-bottom: 1.5rem; }
        .btn { background: #1e3a8a; color: white; padding: 0.6rem 1.2rem; border-radius: 6px; text-decoration: none; font-weight: 600; display: inline-block; }
    </style>
</head>
<body>
<div class="card">
    <h1>An Error Occurred</h1>
    <p th:text="${error != null ? error : 'The requested operation could not be completed.'}"></p>
    <a th:href="@{/}" class="btn">Return to Home</a>
</div>
</body>
</html>
