services:
  postgres-db:
    image: postgres:16-alpine
    container_name: stock_mgmt_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inn_3_grp_b
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inn_3_grp_b"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stock-network

  stock-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_mgmt_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/inn_3_grp_b
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - stock-network

volumes:
  postgres_data:
    driver: local

networks:
  stock-network:
    driver: bridge
